
<h1 class="text-2xl"Tipos</h1>


<div class="flex flex-col">
    <div class="overflow-x-auto">
        <div class="inline-block min-w-full">
            <div class="overflow-hidden">
                <table class="min-w-full divide-y divide-neutral-200 mt-5">
                    <thead class="bg-neutral-50">
                        <tr class="text-neutral-500">
                            <th class="px-5 py-3 text-xs font-medium text-left uppercase">ID</th>
                            <th class="px-5 py-3 text-xs font-medium text-left uppercase">Tipo</th>
                            <th class="px-5 py-3 text-xs font-medium text-left uppercase">Clase</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-neutral-200">


                    {% for tipo in tipos %}
                    <tr class="text-neutral-800">
                            <td class="px-5 py-4 text-sm font-medium whitespace-nowrap">{{ tipo[0] }}</td>
                            <td class="px-5 py-4 text-sm whitespace-nowrap">{{ tipo[1] }}</td>
                            <td class="px-5 py-4 text-sm whitespace-nowrap">{{ tipo[2] }}</td>
                        </tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
